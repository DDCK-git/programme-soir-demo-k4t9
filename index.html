<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#shell{max-width:420px;min-height:100vh;margin:0 auto;background:var(--ground);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(9,55,31,.12)}
#banner{background:var(--ink);color:#fff;font-size:12px;line-height:1.4;padding:8px 16px;text-align:center}
#app{flex:1;display:flex;flex-direction:column;gap:16px;padding:24px 20px 20px}
.kicker{margin:0;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
h1{margin:0;font-size:25px;line-height:1.25;font-weight:700}
h2{margin:0;font-size:18px;font-weight:700}
p{margin:0}
.lead{font-size:14px;line-height:1.55;color:var(--ink2)}
.small{font-size:12.5px;line-height:1.5;color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.btn{min-height:54px;border-radius:27px;border:none;background:var(--ink);color:#fff;font-size:16px;font-weight:600;padding:0 20px;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn[disabled]{background:#9DB3A8;cursor:default}
.btn.ghost{background:var(--ground);color:var(--ink);border:2px solid var(--ink)}
.link{background:none;border:none;padding:10px 0;font-size:13px;font-weight:600;text-decoration:underline;min-height:44px;color:var(--ink)}
.opt{min-height:60px;border-radius:16px;border:1px solid var(--line);background:var(--white);padding:10px 14px;display:flex;align-items:center;gap:12px;text-align:left;font-size:15px;font-weight:500;line-height:1.35;width:100%}
.opt.on{border:2px solid var(--ink);background:var(--t-turq);font-weight:600}
.opt svg{flex-shrink:0}
.bar{height:8px;border-radius:4px;background:var(--t-sage);overflow:hidden}
.bar>i{display:block;height:8px;border-radius:4px;background:var(--turq)}
.card{border-radius:20px;border:1px solid var(--line);background:var(--white);padding:16px}
.tint{border-radius:20px;background:var(--t-turq);padding:16px 18px}
.row{display:flex;align-items:center;gap:12px}
.row>svg{flex-shrink:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:30px;padding:4px 12px;border-radius:15px;background:var(--t-sage);display:inline-flex;align-items:center;font-size:12px;font-weight:600}
.chip.coral{background:var(--t-coral)}
.check{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--white);padding:8px 14px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;line-height:1.35;cursor:pointer}
.check.on{background:var(--t-turq);border-color:var(--t-turq)}
.check input{width:22px;height:22px;accent-color:var(--ink);flex-shrink:0}
.pcard{width:100%;border:2px solid transparent;border-radius:20px;padding:14px;display:flex;align-items:center;gap:14px;text-align:left}
.pcard.on{border-color:var(--ink)}
.pcard svg{flex-shrink:0;overflow:visible}
.pt{display:flex;flex-direction:column;gap:4px}
.pt b{font-size:16px;line-height:1.25}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-width:44px;min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--line);background:var(--white);font-size:14px;font-weight:600}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lbl{font-size:14px;font-weight:700;margin-top:4px}
.quote{border-left:4px solid var(--coral);padding:2px 0 2px 12px;font-size:13.5px;line-height:1.55}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick{position:relative;min-height:150px;border-radius:18px;border:1px solid var(--line);padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.pick.on{outline:3px solid var(--ink);outline-offset:1px}
.pick b{font-size:14px;font-weight:600;line-height:1.25}
@keyframes flip{from{transform:rotateY(90deg) scale(.7)}to{transform:none}}

.tile.pend{border:none;padding:0;cursor:pointer;background:#FF8370;border-radius:50%;animation:pulse .7s ease-in-out infinite alternate}

.mosaic.full{gap:0}

.mosaic.full .tile.on{border-radius:0}
.pick svg{width:72px;height:72px}
.pick svg,.anim svg{overflow:visible}
.anim{display:flex;justify-content:center;border-radius:16px;padding:12px}
.anim svg{width:128px;height:128px}
@keyframes fa{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes fb{0%,49.9%{opacity:0}50%,100%{opacity:1}}
@keyframes rock{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes puff{from{opacity:0}to{opacity:1}}
.fa{animation:fa 1.4s linear infinite}
.fb{opacity:0;animation:fb 1.4s linear infinite}
.rock{transform-box:view-box;transform-origin:32px 44px;animation:rock 1.6s ease-in-out infinite alternate}
.rise{animation:rise 2s ease-in-out infinite alternate}
.puff{animation:puff 2s ease-in-out infinite alternate}
.fb-only .fa{animation:none;opacity:0}.fb-only .fb{animation:none;opacity:1}.fb-only .rock{animation:none;transform:rotate(7deg)}.fb-only .rise{animation:none;transform:translateY(-6px)}.fb-only .puff{animation:none;opacity:1}
@media (prefers-reduced-motion:reduce){.fa,.fb,.rock,.rise,.puff{animation:none}}
.pick em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink2)}
.dot{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.dot.todo{border:2px dashed #9DB3A8}
.dot.now{border:3px solid var(--ink);background:var(--t-turq)}
.meter{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px}
.meter .track{height:12px;border-radius:6px;background:var(--white);overflow:hidden}
.meter .track i{display:block;height:12px;border-radius:6px;background:var(--ink)}
.meter span:last-child{white-space:nowrap}
textarea{border-radius:16px;border:1px solid #9DB3A8;background:var(--white);padding:14px;font-family:inherit;font-size:14px;line-height:1.5;color:var(--ink);resize:none;width:100%}
label.t{font-size:15px;font-weight:700}
#tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--white);border-top:1px solid var(--line)}
#tabs button{min-height:60px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink2)}
#tabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--turq)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
</style>
